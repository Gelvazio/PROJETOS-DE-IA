{% extends "base.html" %}

{% block titulo %}{{ textos.MSG_ERRO_TITULO }}{% endblock %}

{% block conteudo %}

    <h2 class="cartao__titulo">{{ textos.MSG_ERRO_TITULO }}</h2>

    {% if descricao_erro %}

    <p class="cartao__rodape">

    </p>
  </section>
{% endblock %}
