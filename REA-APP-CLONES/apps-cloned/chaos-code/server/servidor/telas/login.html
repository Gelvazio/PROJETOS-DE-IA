{% extends "base.html" %}

{% block titulo %}{{ textos.MSG_LOGIN_TITULO }}{% endblock %}

{% block conteudo %}
  <section class="cartao">
    <h2 class="cartao__titulo">{{ textos.MSG_LOGIN_TITULO }}</h2>

    <form class="formulario" method="post" action="{{ endereco_login }}">
      <input type="hidden" name="csrf_token" value="{{ token_csrf }}">

      <label class="formulario__campo">
        <span>{{ textos.MSG_LOGIN_EMAIL }}</span>
        <input type="email" name="email" autocomplete="username" required>
      </label>

      <label class="formulario__campo">
        <span>{{ textos.MSG_LOGIN_SENHA }}</span>
        <input type="password" name="senha" autocomplete="current-password" required>
      </label>

      <button class="botao botao--primario" type="submit">{{ textos.MSG_LOGIN_BOTAO }}</button>
    </form>

    <p class="cartao__rodape">
      <a href="{{ endereco_cadastro }}">{{ textos.MSG_LOGIN_LINK_CADASTRO }}</a>
    </p>
  </section>
{% endblock %}
